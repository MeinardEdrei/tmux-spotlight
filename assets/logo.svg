<svg width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#3c3c40" />
      <stop offset="50%" stop-color="#232326" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <radialGradient id="sheen" cx="38%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floor-shadow" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="glass" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7c7cd" />
    </linearGradient>
    <filter id="depth" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glint-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
  </defs>

  <style>
    .bob {
      animation: bob 2.6s cubic-bezier(.45,0,.55,1) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Squircle background (Apple-style corner ratio ~0.2237 of width) -->
  <rect x="4" y="4" width="192" height="192" rx="43" fill="url(#bg)" />
  <rect x="4" y="4" width="192" height="192" rx="43" fill="url(#sheen)" />
  <rect x="4" y="4" width="192" height="192" rx="43" fill="url(#floor-shadow)" />
  <rect x="4.5" y="4.5" width="191" height="191" rx="42.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Magnifying glass, optically centered (shifted up-left to counterweight the handle) -->
  <g class="bob" filter="url(#depth)">
    <circle cx="88" cy="84" r="34" fill="none" stroke="url(#glass)" stroke-width="12" />
    <line x1="112.04" y1="108.04" x2="136" y2="132" stroke="url(#glass)" stroke-width="13" stroke-linecap="round" />

    <!-- Light glint on the ring for a designed, non-flat feel -->
    <circle cx="74" cy="66" r="5.5" fill="#ffffff" opacity="0.55" filter="url(#glint-blur)" />

    <!-- Blinking terminal cursor inside the lens -->
    <rect class="blink" x="84" y="66" width="8" height="32" rx="4" fill="#d4d4d8" />
  </g>
</svg>
